<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shinscan</title>
  <script src="marked.min.js"></script>
  <style>
    /* ════════════════════════════════════════════════════════════════
       BROWY — Vercel Geist Design System (per DESIGN.md)
       Stark black-on-near-white developer-platform aesthetic where a
       single ink tone carries every heading, CTA, and border, with a
       multi-stop mesh gradient confined to the hero.
       ════════════════════════════════════════════════════════════════ */

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      /* Brand & Neutral Palette */
      --primary:                 #171717;
      --on-primary:              #ffffff;
      --ink:                     #171717;
      --body:                    #4d4d4d;
      --mute:                    #8f8f8f;
      --faint:                   #a1a1a1;
      --hairline:                #ebebeb;
      --hairline-soft:           #f2f2f2;
      --canvas:                  #fafafa;
      --canvas-elevated:         #ffffff;

      /* Accents & Semantics */
      --link:                    #0070f3;
      --link-deep:               #0761d1;
      --link-soft:               #d3e5ff;
      --error:                   #ee0000;
      --error-deep:              #c50000;
      --warning:                 #f5a623;
      --warning-soft:            #ffefcf;
      --warning-deep:            #ab570a;
      --violet:                  #7928ca;
      --violet-soft:             #d8ccf1;
      --cyan:                    #50e3c2;
      --cyan-soft:               #aaffec;
      --pink:                    #ff0080;
      --magenta:                 #eb367f;

      /* Brand Gradients (Develop / Preview / Ship) */
      --gradient-develop-start:  #007cf0;
      --gradient-develop-end:    #00dfd8;
      --gradient-preview-start:  #7928ca;
      --gradient-preview-end:    #ff0080;
      --gradient-ship-start:     #ff4d4d;
      --gradient-ship-end:       #f9cb28;

      /* Legacy compatibility mappings */
      --bg:                      var(--canvas);
      --solid:                   var(--canvas);
      --solid-2:                 var(--canvas-elevated);
      --translucent:             var(--canvas);
      --translucent-2:           var(--hairline-soft);
      --bub-u-bg:                var(--primary);
      --line:                    var(--hairline);
      --line-2:                  var(--hairline);
      --ink-2:                   var(--mute);
      --green:                   #10b981;
      --lime:                    var(--link);
      --err:                     var(--error);
      --acc:                     var(--link);

      /* Typography */
      --font-sans:               'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      --font-mono:               'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --mono:                    var(--font-mono);

      /* Border Radii */
      --radius-none:             0px;
      --radius-sm:               6px;
      --radius-md:               12px;
      --radius-lg:               16px;
      --radius-pill-cat:         64px;
      --radius-pill:             100px;
      --radius-full:             9999px;

      /* Shadows */
      --shadow-whisper:          0px 1px 2px rgba(0, 0, 0, 0.04);
      --shadow-card:             0px 1px 3px rgba(0, 0, 0, 0.04), 0px 1px 2px rgba(0, 0, 0, 0.02);
      --shadow-floating:         0px 4px 16px rgba(0, 0, 0, 0.08), 0px 1px 2px rgba(0, 0, 0, 0.04);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --primary:                 #ededed;
        --on-primary:              #000000;
        --ink:                     #ededed;
        --body:                    #a1a1a1;
        --mute:                    #737373;
        --faint:                   #525252;
        --hairline:                #262626;
        --hairline-soft:           #171717;
        --canvas:                  #0a0a0a;
        --canvas-elevated:         #111111;
        --link:                    #0070f3;
        --link-deep:               #3291ff;
        --link-soft:               #00254d;
        --error:                   #f87171;
        --error-deep:              #ef4444;
        --warning:                 #f5a623;
        --warning-soft:            #332400;
        --warning-deep:            #fbbf24;
        --bub-u-bg:                #222222;
        --shadow-whisper:          0px 1px 2px rgba(0, 0, 0, 0.3);
        --shadow-card:             0px 1px 3px rgba(0, 0, 0, 0.4);
        --shadow-floating:         0px 4px 18px rgba(0, 0, 0, 0.6);
      }
    }

    html, body {
      font-family: var(--font-sans);
      background: var(--canvas);
      color: var(--ink);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      cursor: default;
      user-select: none;
    }

    /* ── App Shell ─────────────────────────────────────────────────── */
    .app {
      position: relative;
      height: 100vh;
      width: 100vw;
      padding: 48px 0 0 0;
      display: flex;
      flex-direction: column;
      -webkit-app-region: drag;
      background: var(--canvas);
    }

    /* ── Titlebar: Vercel nav-bar aesthetic ────────────────────────── */
    .titlebar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      padding: 0 8px 0 12px;
      border-bottom: 1px solid var(--hairline);
      background: var(--canvas-elevated);
      font-family: var(--font-sans);
      min-height: 42px;
      z-index: 20;
    }

    .tb-brand-cell {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tb-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--mute);
      flex-shrink: 0;
      transition: background 0.2s ease, box-shadow 0.2s ease;
    }
    .tb-dot.live {
      background: var(--link);
      box-shadow: 0 0 8px rgba(0, 112, 243, 0.45);
    }
    .tb-dot.busy {
      background: var(--link);
      animation: pulseDot 0.8s ease infinite alternate;
    }
    .tb-dot.err {
      background: var(--error);
      box-shadow: 0 0 8px rgba(238, 0, 0, 0.45);
    }
    @keyframes pulseDot {
      from { opacity: 0.35; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1.1); }
    }

    .tb-brand {
      color: var(--ink);
      font-weight: 600;
      letter-spacing: -0.4px;
      font-size: 14px;
      line-height: 1;
    }

    .tb-tag {
      color: var(--mute);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Controls cluster */
    .tb-ctrls {
      display: flex;
      align-items: center;
      gap: 3px;
      -webkit-app-region: no-drag;
    }

    .tb-btn {
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      color: var(--body);
      cursor: pointer;
      padding: 0;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }
    .tb-btn:hover {
      background: var(--hairline-soft);
      border-color: var(--hairline);
      color: var(--ink);
    }
    .tb-btn:active {
      background: var(--hairline);
    }
    .tb-btn.danger:hover {
      background: rgba(238, 0, 0, 0.08);
      border-color: rgba(238, 0, 0, 0.2);
      color: var(--error);
    }
    .tb-btn .lbl {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 600;
    }
    .tb-stop {
      display: none;
      color: var(--error);
      flex-direction: column;
      gap: 1px;
      font-size: 11px;
    }
    .tb-stop.show { display: flex; }
    .tb-ico { width: 15px; height: 15px; display: block; stroke-width: 1.5; }

    /* ── Infobar (secondary technical bar) ─────────────────────────── */
    .infobar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-bottom: 1px solid var(--hairline);
      background: var(--canvas);
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--body);
      min-height: 28px;
      user-select: none;
    }

    .ib-browser {
      color: var(--ink);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 600;
      font-size: 10px;
      flex-shrink: 0;
      padding: 2px 6px;
      background: var(--canvas-elevated);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-sm);
    }
    .ib-tabs { color: var(--mute); flex-shrink: 0; font-size: 11px; }
    .ib-sep { color: var(--hairline); flex-shrink: 0; font-weight: 300; }
    .ib-ttl {
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 12px;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .ib-ttl.action { color: var(--link); font-weight: 500; font-family: var(--font-mono); }
    .ib-host {
      color: var(--mute);
      font-size: 11px;
      max-width: 130px;
      flex-shrink: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ib-browsers {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 2px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--mute);
      padding: 2px 7px;
      border: 1px solid var(--hairline);
      border-radius: var(--radius-pill);
      background: var(--canvas-elevated);
      letter-spacing: 0.04em;
    }
    .ib-browsers .ib-bcount { color: var(--ink); font-weight: 600; }

    /* ── Connection banner ─────────────────────────────────────────── */
    .conn-banner {
      flex: 0 0 auto;
      display: none;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      font-family: var(--font-sans);
      font-size: 12px;
      border-bottom: 1px solid rgba(238, 0, 0, 0.18);
      background: rgba(238, 0, 0, 0.05);
      color: var(--error);
    }
    .conn-banner.show { display: flex; }
    .conn-banner.warn {
      border-bottom-color: rgba(245, 166, 35, 0.25);
      background: var(--warning-soft);
      color: var(--warning-deep);
    }
    .conn-banner .cb-spinner {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      animation: pulseDot 0.7s ease infinite alternate;
    }
    .conn-banner a { color: inherit; font-weight: 600; text-decoration: underline; cursor: pointer; }
    .conn-banner .cb-spacer { flex: 1; }

    /* ── Mascot (Hardware Companion) ───────────────────────────────── */
    .mascot {
      position: absolute;
      top: 2px;
      left: 8px;
      width: 52px;
      height: 52px;
      z-index: 30;
      -webkit-app-region: no-drag;
      cursor: grab;
      transition: transform 0.18s ease;
    }
    .mascot:active { cursor: grabbing; }
    .mascot.dragging { cursor: grabbing; transition: none; }
    .mascot:hover { transform: translateY(-1px); }
    .mascot svg { width: 100%; height: 100%; display: block; }

    /* ── Main Panel Container ──────────────────────────────────────── */
    .panel {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      position: relative;
      background: var(--canvas);
    }

    /* ── Message Stream ────────────────────────────────────────────── */
    .msgs {
      flex: 1;
      padding: 16px 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      user-select: text;
    }
    .msgs::-webkit-scrollbar { width: 6px; }
    .msgs::-webkit-scrollbar-thumb {
      background: var(--hairline);
      border-radius: 3px;
    }
    .msgs::-webkit-scrollbar-track { background: transparent; }

    /* ── Hero / Empty State (Vercel Mesh Gradient) ─────────────────── */
    .empty {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 16px;
      margin: auto 0;
      overflow: hidden;
      border-radius: var(--radius-lg);
    }

    /* Vercel multi-stop mesh gradient bloom */
    .empty-mesh {
      position: absolute;
      inset: -40px;
      background:
        radial-gradient(ellipse 60% 40% at 50% 10%, rgba(0, 124, 240, 0.14) 0%, transparent 60%),
        radial-gradient(circle 120px at 25% 45%, rgba(121, 40, 202, 0.12) 0%, transparent 70%),
        radial-gradient(circle 130px at 75% 45%, rgba(255, 0, 128, 0.08) 0%, transparent 70%),
        radial-gradient(ellipse 50% 30% at 50% 80%, rgba(249, 203, 40, 0.08) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
      filter: blur(20px);
    }

    .empty-eyebrow {
      position: relative;
      z-index: 1;
      margin-bottom: 12px;
    }
    .empty-badge {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--mute);
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      background: var(--canvas-elevated);
      border: 1px solid var(--hairline);
      box-shadow: var(--shadow-whisper);
    }

    .empty .greet {
      position: relative;
      z-index: 1;
      font-family: var(--font-sans);
      font-size: 34px;
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -1.3px;
      color: var(--ink);
      margin-bottom: 6px;
    }

    .empty-desc {
      position: relative;
      z-index: 1;
      font-size: 13px;
      color: var(--body);
      max-width: 280px;
      line-height: 1.45;
      margin-bottom: 8px;
    }

    .empty .hint {
      position: relative;
      z-index: 1;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--mute);
      letter-spacing: 0.02em;
      margin-bottom: 20px;
    }

    /* Suggestion Chips */
    .empty-suggestions {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      max-width: 290px;
    }
    .sugg-chip {
      background: var(--canvas-elevated);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 12px;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: var(--shadow-whisper);
      transition: border-color 0.15s ease, transform 0.15s ease, background 0.15s ease;
    }
    .sugg-chip:hover {
      border-color: var(--ink);
      transform: translateY(-1px);
    }
    .sugg-icon {
      font-size: 13px;
      opacity: 0.75;
    }

    /* ── Chat Bubbles ──────────────────────────────────────────────── */
    .bub {
      max-width: 90%;
      font-size: 13px;
      line-height: 1.6;
      word-wrap: break-word;
    }

    /* User Message: Vercel Ink Pill */
    .bub.u {
      align-self: flex-end;
      background: var(--primary);
      color: var(--on-primary);
      padding: 8px 14px;
      border-radius: 16px 16px 4px 16px;
      font-weight: 400;
      box-shadow: var(--shadow-whisper);
    }

    /* Assistant Message: Elevated Hairline Card */
    .bub.a {
      align-self: stretch;
      max-width: 100%;
      background: var(--canvas-elevated);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      color: var(--ink);
      box-shadow: var(--shadow-card);
    }

    .bub.a p { margin: 0 0 8px; }
    .bub.a p:last-child { margin: 0; }
    .bub.a strong { color: var(--ink); font-weight: 600; }
    .bub.a em { font-style: italic; }
    .bub.a code {
      font-family: var(--font-mono);
      background: var(--hairline-soft);
      border: 1px solid var(--hairline);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12px;
      color: var(--ink);
    }
    .bub.a pre {
      background: var(--hairline-soft);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      margin: 8px 0;
      overflow-x: auto;
    }
    .bub.a pre code {
      background: transparent;
      border: none;
      padding: 0;
      color: var(--ink);
      font-size: 12px;
    }
    .bub.a ul, .bub.a ol { padding-left: 18px; margin: 6px 0; }
    .bub.a li { margin-bottom: 4px; }
    .bub.a a {
      color: var(--link);
      text-decoration: none;
      border-bottom: 1px solid var(--link-soft);
      transition: border-color 0.15s ease, color 0.15s ease;
    }
    .bub.a a:hover {
      color: var(--link-deep);
      border-bottom-color: var(--link);
    }
    .bub.a .cursor {
      display: inline-block;
      width: 6px;
      height: 14px;
      background: var(--ink);
      vertical-align: -2px;
      margin-left: 2px;
      animation: blinkCursor 0.9s steps(2) infinite;
    }
    @keyframes blinkCursor { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

    .bub.a.err {
      color: var(--error);
      background: rgba(238, 0, 0, 0.04);
      border-color: rgba(238, 0, 0, 0.25);
    }

    /* ── Tool Steps (Vercel Console Disclosure) ────────────────────── */
    .tool-steps {
      margin: 4px 0 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-family: var(--font-mono);
    }
    .tool-step {
      font-size: 11px;
      color: var(--body);
      display: grid;
      grid-template-columns: 14px 1fr auto;
      grid-template-rows: auto auto;
      column-gap: 6px;
      row-gap: 2px;
      cursor: pointer;
      padding: 5px 8px;
      background: var(--hairline-soft);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-sm);
      transition: background 0.12s ease;
    }
    .tool-step:hover {
      background: #eaeaea;
    }
    .tool-step .glyph {
      grid-column: 1; grid-row: 1;
      font-family: var(--font-mono); font-weight: 700;
      color: var(--mute); text-align: center;
    }
    .tool-step.running .glyph { color: var(--link); }
    .tool-step.done    .glyph { color: var(--ink); }
    .tool-step.error   .glyph { color: var(--error); }
    .tool-step .glyph::before { content: '⏺'; }
    .tool-step.running .glyph::before { content: '⠋'; animation: spinFrames 0.8s steps(10) infinite; }
    .tool-step.done    .glyph::before { content: '⏺'; }
    .tool-step.error   .glyph::before { content: '⏺'; }

    .tool-step .head {
      grid-column: 2; grid-row: 1;
      min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .tool-step .name { color: var(--ink); font-weight: 600; }
    .tool-step .paren { color: var(--mute); }
    .tool-step .args  { color: var(--body); }
    .tool-step.error .name { color: var(--error); }

    .tool-step .ms {
      grid-column: 3; grid-row: 1;
      color: var(--mute); font-size: 10px;
    }

    .tool-step .out {
      grid-column: 2 / span 2; grid-row: 2;
      color: var(--mute);
      display: flex; align-items: baseline; gap: 4px;
      font-size: 10.5px;
      min-width: 0;
    }
    .tool-step .out .arc { color: var(--mute); opacity: 0.6; flex-shrink: 0; }
    .tool-step .out .arc::before { content: '⎿'; }
    .tool-step .out .preview {
      flex: 1; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .tool-step.error .out { color: var(--error); opacity: 0.9; }
    .tool-step.running .out { color: var(--link); font-style: italic; }
    .tool-step.expanded .out .preview { white-space: pre-wrap; word-break: break-word; }

    .tool-steps.collapsed .tool-step { display: none; }
    .tool-steps.collapsed .tools-summary { display: flex; }
    .tools-summary {
      display: none; align-items: center; gap: 6px;
      font-family: var(--font-mono); font-size: 11px;
      color: var(--body); cursor: pointer;
      padding: 4px 10px;
      background: var(--canvas-elevated);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-pill);
      box-shadow: var(--shadow-whisper);
      align-self: flex-start;
      transition: border-color 0.15s ease, color 0.15s ease;
    }
    .tools-summary:hover { border-color: var(--ink); color: var(--ink); }
    .tools-summary .glyph { color: var(--mute); font-weight: 700; }
    .tools-summary .glyph::before { content: '⏺'; }
    .tools-summary .arrow::before { content: '▸'; opacity: 0.6; }
    .tool-steps.expanded-back .tools-summary .arrow::before { content: '▾'; }
    .tool-steps.expanded-back.collapsed .tool-step { display: grid; }
    .tool-steps.expanded-back.collapsed .tools-summary { border-color: var(--ink); color: var(--ink); }

    @keyframes spinFrames {
      0%   { content: '⠋'; } 10%  { content: '⠙'; } 20%  { content: '⠹'; }
      30%  { content: '⠸'; } 40%  { content: '⠼'; } 50%  { content: '⠴'; }
      60%  { content: '⠦'; } 70%  { content: '⠧'; } 80%  { content: '⠇'; }
      90%  { content: '⠏'; } 100% { content: '⠋'; }
    }

    /* Reasoning line */
    .reasoning {
      font-size: 11px; color: var(--mute);
      font-style: italic;
      margin: 4px 0 8px;
      padding-left: 8px;
      border-left: 2px solid var(--hairline);
    }

    /* ── Input Area ────────────────────────────────────────────────── */
    .inp-row {
      flex: 0 0 auto;
      padding: 10px 12px 14px;
      background: var(--canvas);
      border-top: 1px solid var(--hairline);
      display: flex;
      align-items: stretch;
      gap: 8px;
      -webkit-app-region: no-drag;
    }

    .inp-row .field {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: flex-end;
      gap: 6px;
      background: var(--canvas-elevated);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-md);
      padding: 6px 10px 6px 12px;
      box-shadow: var(--shadow-whisper);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .inp-row .field:focus-within {
      border-color: var(--ink);
      box-shadow: 0 0 0 1px var(--ink);
    }

    .inp-row .prompt {
      color: var(--mute);
      font-family: var(--font-mono);
      font-weight: 500;
      font-size: 14px;
      user-select: none;
      padding-bottom: 6px;
    }

    .inp-row textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 13px;
      max-height: 120px;
      min-height: 26px;
      line-height: 1.5;
      caret-color: var(--link);
      padding: 4px 0;
    }
    .inp-row textarea::placeholder {
      color: var(--faint);
    }

    /* Vercel Primary Action Pill / Circular Send Button */
    .inp-row .send {
      background: var(--primary);
      border: none;
      color: var(--on-primary);
      cursor: pointer;
      width: 32px;
      height: 32px;
      border-radius: var(--radius-full);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.12s ease, opacity 0.12s ease, background 0.15s ease;
      font-size: 14px;
      font-weight: 600;
    }
    .inp-row .send:hover:not(:disabled) {
      transform: scale(1.05);
      background: #000000;
    }
    .inp-row .send:active:not(:disabled) {
      transform: scale(0.96);
    }
    .inp-row .send:disabled {
      background: var(--hairline);
      color: var(--faint);
      cursor: default;
      opacity: 0.55;
    }

    /* ── Chats History Overlay ─────────────────────────────────────── */
    .chats-overlay {
      position: absolute;
      inset: 0;
      background: var(--canvas);
      z-index: 50;
      display: none;
      flex-direction: column;
      -webkit-app-region: no-drag;
    }
    .chats-overlay.open { display: flex; }

    .chats-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--hairline);
      background: var(--canvas-elevated);
      min-height: 42px;
    }
    .chats-head .title {
      flex: 1;
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.2px;
      color: var(--ink);
    }
    .chats-head .title b { font-weight: 600; }
    .chats-head .close-x {
      background: transparent;
      border: 1px solid transparent;
      color: var(--body);
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: var(--radius-sm);
      font-size: 16px;
      transition: background 0.12s ease, border-color 0.12s ease;
    }
    .chats-head .close-x:hover {
      background: var(--hairline-soft);
      border-color: var(--hairline);
      color: var(--ink);
    }

    .chats-search {
      padding: 10px 14px;
      border-bottom: 1px solid var(--hairline);
      background: var(--canvas);
    }
    .chats-search input {
      width: 100%;
      background: var(--canvas-elevated);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-sm);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 12px;
      padding: 7px 10px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .chats-search input:focus {
      border-color: var(--ink);
      box-shadow: 0 0 0 1px var(--ink);
    }

    .chats-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .chats-list::-webkit-scrollbar { width: 5px; }
    .chats-list::-webkit-scrollbar-thumb { background: var(--hairline); border-radius: 3px; }

    .chats-empty {
      padding: 36px 16px;
      color: var(--mute);
      text-align: center;
      font-size: 12px;
    }

    .chat-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--canvas-elevated);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: border-color 0.12s ease, box-shadow 0.12s ease;
    }
    .chat-row:hover {
      border-color: var(--mute);
      box-shadow: var(--shadow-whisper);
    }
    .chat-row.current {
      border-color: var(--ink);
      background: var(--hairline-soft);
    }
    .chat-row .chat-body { flex: 1; min-width: 0; }
    .chat-row .chat-title {
      color: var(--ink);
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chat-row .chat-meta {
      color: var(--mute);
      font-family: var(--font-mono);
      font-size: 10px;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chat-row .chat-meta .dot { color: var(--link); }
    .chat-row .chat-del {
      background: transparent;
      border: 0;
      color: var(--mute);
      width: 24px;
      height: 24px;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: var(--radius-sm);
      flex-shrink: 0;
    }
    .chat-row:hover .chat-del { display: flex; }
    .chat-row .chat-del:hover {
      background: rgba(238, 0, 0, 0.08);
      color: var(--error);
    }
    .chat-row .chat-del svg { width: 13px; height: 13px; }

    .chats-foot {
      border-top: 1px solid var(--hairline);
      padding: 10px 14px;
      display: flex;
      gap: 8px;
      align-items: center;
      background: var(--canvas-elevated);
    }
    .chats-foot button {
      background: var(--primary);
      color: var(--on-primary);
      border: 1px solid var(--primary);
      border-radius: var(--radius-sm);
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 500;
      padding: 5px 12px;
      cursor: pointer;
      transition: opacity 0.12s ease;
    }
    .chats-foot button:hover { opacity: 0.9; }
    .chats-foot .spacer { flex: 1; }
    .chats-foot .hint {
      color: var(--mute);
      font-family: var(--font-mono);
      font-size: 11px;
    }

    /* ════════════════════════════════════════════════════════════════
       MASCOT ENGINE & POSES
       ════════════════════════════════════════════════════════════════ */
    .browy { display: block; }
    .browy g.pose { display: none; }
    .browy[data-pose="idle"]  g.pose-idle  { display: block; }
    .browy[data-pose="left"]  g.pose-left  { display: block; }
    .browy[data-pose="right"] g.pose-right { display: block; }
    .browy[data-pose="up"]    g.pose-up    { display: block; }
    .browy[data-pose="blink"] g.pose-blink { display: block; }
    .browy[data-pose="happy"] g.pose-happy { display: block; }
    .browy[data-pose="think"] g.pose-think { display: block; }
    .browy[data-pose="err"]   g.pose-err   { display: block; }
    .browy[data-pose="work"]  g.pose-work  { display: block; }
    .browy[data-pose="sleep"] g.pose-sleep { display: block; }
    .browy[data-pose="love"]  g.pose-love  { display: block; }
    .browy[data-pose="wow"]   g.pose-wow   { display: block; }

    .browy .ant-ball { animation: antPulse 1.6s steps(2) infinite; transform-origin: 40px 8px; }
    .browy .ant      { transform-origin: 40px 18px; animation: antSway 4s steps(4) infinite; }
    .browy .ant-glow { animation: glowPulse 1.6s steps(2) infinite; }
    .browy[data-pose="think"] .ant-ball { animation: antThink 0.4s steps(2) infinite; }
    .browy[data-pose="think"] .ant      { animation: antSway 1.2s steps(4) infinite; }
    .browy[data-pose="work"]  .ant-ball { animation: antThink 0.25s steps(2) infinite; fill: var(--cyan); }
    .browy[data-pose="work"]  .ant      { animation: antSway 0.8s steps(4) infinite; }
    .browy[data-pose="err"]   .ant-ball { fill: var(--error); animation: antPulse 0.3s steps(2) infinite; }
    .browy[data-pose="sleep"] .ant-ball { animation: antPulse 3s steps(2) infinite; opacity: 0.5; }
    .browy[data-pose="sleep"] .ant      { animation: none; transform: rotate(-4deg); }
    .browy[data-pose="love"]  .ant-ball { fill: var(--error); }
    @keyframes antPulse  { 0%,49% { opacity: 1; } 50%,100% { opacity: 0.4; } }
    @keyframes antThink  { 0%,49% { fill: var(--cyan); } 50%,100% { fill: var(--link); } }
    @keyframes antSway   { 0%,100% { transform: rotate(0deg); } 25% { transform: rotate(-3deg); } 75% { transform: rotate(3deg); } }
    @keyframes glowPulse { 0%,49% { opacity: 1; } 50%,100% { opacity: 0.55; } }

    .browy .arm-l, .browy .arm-l-hand { transform-origin: 8px 50px; }
    .browy .arm-r, .browy .arm-r-hand { transform-origin: 72px 50px; }
    .browy[data-pose="happy"] .arm-l       { transform: rotate(-30deg); }
    .browy[data-pose="happy"] .arm-l-hand  { transform: rotate(-30deg); }
    .browy[data-pose="happy"] .arm-r       { transform: rotate(30deg); }
    .browy[data-pose="happy"] .arm-r-hand  { transform: rotate(30deg); }
    .browy[data-pose="work"]  .arm-l, .browy[data-pose="work"] .arm-l-hand { animation: typeL 0.35s steps(2) infinite; }
    .browy[data-pose="work"]  .arm-r, .browy[data-pose="work"] .arm-r-hand { animation: typeR 0.35s steps(2) infinite; }
    @keyframes typeL { 0%,49% { transform: translateY(0); } 50%,100% { transform: translateY(2px); } }
    @keyframes typeR { 0%,49% { transform: translateY(2px); } 50%,100% { transform: translateY(0); } }
    .browy[data-pose="wow"] .arm-l, .browy[data-pose="wow"] .arm-l-hand { transform: rotate(-15deg) translateX(-2px); }
    .browy[data-pose="wow"] .arm-r, .browy[data-pose="wow"] .arm-r-hand { transform: rotate(15deg)  translateX(2px); }

    .browy { animation: breathe 2.4s steps(2) infinite; transform-origin: 40px 78px; }
    @keyframes breathe { 0%,49% { transform: translateY(0); } 50%,100% { transform: translateY(-1px); } }
    .browy[data-pose="sleep"] { animation: sleepBreathe 3.6s steps(3) infinite; }
    @keyframes sleepBreathe { 0%,33% { transform: translateY(0); } 34%,66% { transform: translateY(1px); } 67%,100% { transform: translateY(0); } }

    .browy.bounce ~ * .ground, .browy.bounce .ground { animation: shadowSquish 0.3s steps(2) 1; }
    @keyframes shadowSquish { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(0.7); } }

    .browy.nod    { animation: nod    0.3s steps(2) 1; }
    .browy.shake  { animation: shake  0.4s steps(2) 2; }
    .browy.bounce { animation: bounce 0.36s steps(3) 1; }
    .browy.spin   { animation: spin   0.45s steps(4) 1; }
    .browy.wave .arm-r, .browy.wave .arm-r-hand { animation: waveArm 0.5s steps(2) 3; }
    @keyframes waveArm { 0%,100% { transform: rotate(20deg); } 50% { transform: rotate(60deg) translateX(2px); } }
    @keyframes nod    { 0% { transform: translateY(0); } 50% { transform: translateY(3px); } 100% { transform: translateY(0); } }
    @keyframes shake  { 0% { transform: translateX(0); } 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } 100% { transform: translateY(0); } }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 33% { transform: translateY(-5px); } 66% { transform: translateY(-2px); } }
    @keyframes spin   { 0% { transform: rotate(0); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="app">

  <div class="mascot" id="mascotBox" title="Shinscan">
    <svg class="browy" id="browy" data-pose="idle" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
      <!-- ── ANTENNA: Vercel blue/cyan signal bulb ── -->
      <g class="ant" id="ant">
        <rect x="28" y="4" width="24" height="6" fill="rgba(0,112,243,0.18)" class="ant-glow"/>
        <rect x="30" y="2" width="20" height="2" fill="rgba(0,112,243,0.12)" class="ant-glow"/>

        <!-- stalk -->
        <rect x="38" y="12" width="4" height="2" fill="#404040"/>
        <rect x="38" y="14" width="4" height="2" fill="#262626"/>
        <rect x="38" y="16" width="4" height="2" fill="#171717"/>
      </g>

      <!-- ── HEAD: Vercel Matte Ink Bezel ── -->
      <rect x="14" y="18" width="52" height="2" fill="#262626"/>

      <rect x="64" y="25" width="1" height="40" fill="#262626"/>
      <!-- scanlines -->
      <rect x="15" y="32" width="50" height="1" fill="rgba(255,255,255,0.04)" class="scan"/>
      <rect x="15" y="42" width="50" height="1" fill="rgba(255,255,255,0.04)" class="scan"/>
      <rect x="15" y="52" width="50" height="1" fill="rgba(255,255,255,0.04)" class="scan"/>

      <!-- power LED -->

      <!-- ── POSE: idle ── -->

        <rect x="22" y="35" width="12" height="10" fill="#ffffff"/>

      <!-- ── POSE: work ── -->
      <g class="pose pose-work">
        <rect x="22" y="35" width="12" height="10" fill="#ffffff"/>
        <rect x="46" y="35" width="12" height="10" fill="#ffffff"/>
        <rect x="26" y="38" width="4" height="4" fill="#0a0a0a"/>
        <rect x="50" y="38" width="4" height="4" fill="#0a0a0a"/>
        <rect x="36" y="55" width="8" height="2" fill="#00dfd8"/>
        <rect x="52" y="60" width="2" height="2" fill="#0070f3"/>
        <rect x="56" y="60" width="2" height="2" fill="#0070f3"/>
        <rect x="54" y="58" width="2" height="2" fill="#0070f3"/>
        <rect x="54" y="62" width="2" height="2" fill="#0070f3"/>
      </g>

      <!-- ── POSE: sleep ── -->
      <g class="pose pose-sleep">
        <rect x="22" y="40" width="12" height="2" fill="#50e3c2"/>
        <rect x="46" y="40" width="12" height="2" fill="#50e3c2"/>
        <rect x="34" y="55" width="12" height="2" fill="#262626"/>
        <rect x="58" y="28" width="6" height="2" fill="#79b8ff" class="zzz"/>
        <rect x="62" y="30" width="2" height="2" fill="#79b8ff" class="zzz"/>
        <rect x="60" y="32" width="2" height="2" fill="#79b8ff" class="zzz"/>
        <rect x="58" y="34" width="6" height="2" fill="#79b8ff" class="zzz"/>
      </g>

      <!-- ── POSE: love ── -->
      <g class="pose pose-love">
        <rect x="24" y="36" width="2" height="2" fill="#ff0080"/>
        <rect x="30" y="36" width="2" height="2" fill="#ff0080"/>
        <rect x="22" y="38" width="12" height="2" fill="#ff0080"/>
        <rect x="22" y="40" width="12" height="2" fill="#ff0080"/>
        <rect x="24" y="42" width="8" height="2" fill="#ff0080"/>
        <rect x="26" y="44" width="4" height="2" fill="#ff0080"/>
        <rect x="48" y="36" width="2" height="2" fill="#ff0080"/>
        <rect x="54" y="36" width="2" height="2" fill="#ff0080"/>
        <rect x="46" y="38" width="12" height="2" fill="#ff0080"/>
        <rect x="46" y="40" width="12" height="2" fill="#ff0080"/>
        <rect x="48" y="42" width="8" height="2" fill="#ff0080"/>
        <rect x="50" y="44" width="4" height="2" fill="#ff0080"/>
        <rect x="30" y="54" width="20" height="2" fill="#ff0080"/>
      </g>

      <!-- ── POSE: wow ── -->
      <g class="pose pose-wow">
        <rect x="20" y="33" width="14" height="14" fill="#ffffff"/>
        <rect x="46" y="33" width="14" height="14" fill="#ffffff"/>
        <rect x="24" y="37" width="6" height="6" fill="#0a0a0a"/>
        <rect x="50" y="37" width="6" height="6" fill="#0a0a0a"/>
        <rect x="36" y="54" width="8" height="2" fill="#0a0a0a"/>
        <rect x="34" y="56" width="2" height="4" fill="#0a0a0a"/>
        <rect x="44" y="56" width="2" height="4" fill="#0a0a0a"/>
        <rect x="36" y="60" width="8" height="2" fill="#0a0a0a"/>
      </g>

      <!-- ── ARMS ── -->
      <g class="arms" id="arms">
        <rect class="arm-l" x="6"  y="50" width="2" height="6" fill="#262626"/>
        <rect class="arm-r" x="72" y="50" width="2" height="6" fill="#262626"/>
        <rect class="arm-l-hand" x="6"  y="54" width="2" height="2" fill="#404040"/>
        <rect class="arm-r-hand" x="72" y="54" width="2" height="2" fill="#404040"/>
      </g>

      <!-- ── BODY STAND ── -->
      <rect x="36" y="70" width="8" height="2" fill="#262626"/>
      <rect x="32" y="72" width="16" height="2" fill="#171717"/>
      <rect x="32" y="72" width="16" height="1" fill="#333333"/>

      <!-- ── FEET ── -->
      <rect x="22" y="74" width="10" height="4" fill="#262626"/>
      <rect x="48" y="74" width="10" height="4" fill="#262626"/>
      <rect x="22" y="74" width="10" height="1" fill="#404040"/>
      <rect x="48" y="74" width="10" height="1" fill="#404040"/>
      <rect x="26" y="76" width="1" height="2" fill="#0a0a0a"/>
      <rect x="29" y="76" width="1" height="2" fill="#0a0a0a"/>
      <rect x="52" y="76" width="1" height="2" fill="#0a0a0a"/>
      <rect x="55" y="76" width="1" height="2" fill="#0a0a0a"/>

      <!-- ── GROUND SHADOW ── -->
      <rect x="20" y="78" width="2" height="1" fill="rgba(0,0,0,0.15)" class="ground"/>
      <rect x="24" y="78" width="6" height="1" fill="rgba(0,0,0,0.20)" class="ground"/>
      <rect x="32" y="78" width="16" height="1" fill="rgba(0,0,0,0.25)" class="ground"/>
      <rect x="50" y="78" width="6" height="1" fill="rgba(0,0,0,0.20)" class="ground"/>
      <rect x="58" y="78" width="2" height="1" fill="rgba(0,0,0,0.15)" class="ground"/>
    </svg>
  </div>

  <!-- ── Top Titlebar ──────────────────────────────────────────────── -->
  <div class="titlebar">
    <div class="tb-brand-cell">
      <span class="tb-dot" id="dot"></span>
      <span class="tb-brand">shinscan</span>
      <span class="tb-tag" id="modeTag" title="Current chat">// browser agent</span>
    </div>
    <div class="tb-ctrls">
      <button class="tb-btn tb-stop danger" id="stopBtn" title="Stop generation (Esc)">
        ■<span class="lbl">stop</span>
      </button>
      <button class="tb-btn" id="newChatBtn" title="Start a new chat (saves current chat to history)">
        <svg class="tb-ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 3h7l3 3v7a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/>
          <path d="M8 7v4M6 9h4"/>
        </svg>
      </button>
      <button class="tb-btn" id="chatsBtn" title="Open past chats">
        <svg class="tb-ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2 4h12M2 8h12M2 12h8"/>
        </svg>
      </button>
      <button class="tb-btn" id="exportBtn" title="Export this chat as Markdown (Ctrl+Shift+E)">
        <svg class="tb-ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M8 2v8M5 7l3 3 3-3M3 12v1a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-1"/>
        </svg>
      </button>
      <button class="tb-btn" id="providersBtn" title="LLM Providers & AI Gateways (DeepSeek, OmniRoute, etc.)">
        <svg class="tb-ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="8" cy="8" r="2.5"/>
          <path d="M8 1v3M8 12v3M1 8h3M12 8h3M3.05 3.05l2.12 2.12M10.83 10.83l2.12 2.12M3.05 12.95l2.12-2.12M10.83 5.17l2.12-2.12"/>
        </svg>
      </button>
      <button class="tb-btn" id="settingsBtn" title="Control panel — browsers, model, settings">
        <svg class="tb-ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linejoin="round" aria-hidden="true">
          <path d="M9.4 1.5h-2.8l-.4 1.8a4.7 4.7 0 0 0-1.4.8l-1.7-.7-1.4 2.4 1.4 1.2a4.7 4.7 0 0 0 0 1.6l-1.4 1.2 1.4 2.4 1.7-.7c.43.34.9.6 1.4.8l.4 1.8h2.8l.4-1.8c.5-.2.97-.46 1.4-.8l1.7.7 1.4-2.4-1.4-1.2a4.7 4.7 0 0 0 0-1.6l1.4-1.2-1.4-2.4-1.7.7a4.7 4.7 0 0 0-1.4-.8L9.4 1.5z"/>
          <circle cx="8" cy="8" r="1.9"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- ── Secondary Infobar ─────────────────────────────────────────── -->
  <div class="infobar">
    <span class="ib-browser" id="brand">—</span>
    <span class="ib-tabs" id="tabs">0 tabs</span>
    <span class="ib-sep">│</span>
    <span class="ib-ttl" id="ttl" title="">connecting…</span>
    <span class="ib-host" id="host"></span>
    <span class="ib-browsers" id="browsersChip" title="Connected / installed browsers">
      <span class="ib-bcount" id="browsersCount">0</span>/<span id="browsersTotal">0</span>
    </span>
  </div>

  <!-- ── Reconnect Banner ──────────────────────────────────────────── -->
  <div class="conn-banner" id="connBanner" role="status" aria-live="polite">
    <span class="cb-spinner" aria-hidden="true"></span>
    <span id="connBannerText">host disconnected — reconnecting…</span>
    <span class="cb-spacer"></span>
    <span id="connBannerAction"></span>
  </div>

  <!-- ── Main Chat Panel ───────────────────────────────────────────── -->
  <div class="panel">

    <div class="msgs" id="msgs">
      <!-- Empty / Hero state with Vercel Mesh Gradient -->
      <div class="empty" id="empty">
        <div class="empty-mesh" aria-hidden="true"></div>
        <div class="empty-eyebrow">
          <span class="empty-badge">AI BROWSER AGENT</span>
        </div>
        <div class="greet">shinscan</div>
        <div class="empty-desc">Drive real tabs through chat · Automate, inspect, navigate</div>
        <div class="hint">// type below</div>
        <div class="empty-suggestions">
          <button type="button" class="sugg-chip" data-prompt="Summarize this page in 3 clear bullet points">
            <span class="sugg-icon">⚡</span>
            <span>Summarize page</span>
          </button>
          <button type="button" class="sugg-chip" data-prompt="Find all clickable buttons and inputs on this page">
            <span class="sugg-icon">🔍</span>
            <span>Inspect elements</span>
          </button>
          <button type="button" class="sugg-chip" data-prompt="Extract the main text content to markdown">
            <span class="sugg-icon">📋</span>
            <span>Extract text</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Input Row with Vercel pill button -->
    <div class="inp-row" id="inpRow">
      <div class="field">
        <span class="prompt">&gt;</span>
        <textarea id="inp" rows="1" placeholder="ask shinscan…" autofocus></textarea>
        <button class="send" id="goBtn" disabled title="Send message (Enter)">↵</button>
      </div>
    </div>

    <!-- Past-chats overlay -->
    <div class="chats-overlay" id="chatsOverlay" aria-hidden="true">
      <div class="chats-head">
        <span class="title"><b>chats</b> // history</span>
        <button class="close-x" id="chatsCloseBtn" title="Back to current chat">×</button>
      </div>
      <div class="chats-search">
        <input type="text" id="chatsSearch" placeholder="filter chats…" autocomplete="off" spellcheck="false" />
      </div>
      <div class="chats-list" id="chatsList"></div>
      <div class="chats-foot">
        <button id="chatsNewBtn" title="Start a brand new chat">+ new chat</button>
        <span class="spacer"></span>
        <span class="hint" id="chatsHint">0 chats</span>
      </div>
    </div>
  </div>
</div>

<script src="sidepanel.js"></script>
</body>
</html>
