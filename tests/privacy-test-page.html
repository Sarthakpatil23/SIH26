<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browy Privacy & Profile Verification Test</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --border: #1f293d;
      --text: #f3f4f6;
      --text-dim: #9ca3af;
      --primary: #6366f1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .profile-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    .profile-banner {
      height: 140px;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #ec4899 100%);
    }
    .profile-body {
      padding: 0 24px 24px 24px;
      position: relative;
    }
    .profile-avatar-wrap {
      width: 108px;
      height: 108px;
      border-radius: 50%;
      border: 4px solid var(--card-bg);
      overflow: hidden;
      margin-top: -54px;
      background: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .profile-avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .profile-meta {
      margin-top: 12px;
    }
    /* Standard LinkedIn heading class */
    h1.text-heading-xlarge {
      font-size: 24px;
      font-weight: 700;
      color: #f9fafb;
    }
    .profile-headline {
      font-size: 15px;
      color: var(--text-dim);
      margin-top: 4px;
    }
    .profile-session-info {
      margin-top: 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.2);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      color: #a5b4fc;
    }
    .form-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
    }
    .form-card h2 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group.full-width {
      grid-column: span 2;
    }
    label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-dim);
    }
    input {
      background: #0b1120;
      border: 1px solid #283548;
      border-radius: 6px;
      padding: 10px 12px;
      color: #f3f4f6;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus {
      border-color: var(--primary);
    }
    .btn-submit {
      margin-top: 16px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 10px 20px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- User Profile Card -->
    <div class="profile-card">
      <div class="profile-banner"></div>
      <div class="profile-body">
        <div class="profile-avatar-wrap">
          <img
            class="profile-photo avatar-large"
            src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%236366f1'/><circle cx='50' cy='38' r='18' fill='%23ffffff'/><path d='M20,85 C20,65 35,55 50,55 C65,55 80,65 80,85 Z' fill='%23ffffff'/></svg>"
            alt="Profile Avatar"
          />
        </div>
        <div class="profile-meta">
          <h1 class="text-heading-xlarge" itemprop="name">Sarthak Patil</h1>
          <div class="profile-headline">Senior Staff Autonomous Systems Engineer & AI Researcher</div>
          <div class="profile-session-info">
            <span>●</span>
            <span>Signed in as: Sarthak Patil (sarthak@browy-ai.test)</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Account Details Form -->
    <div class="form-card">
      <h2>Profile & Billing Information</h2>
      <form onsubmit="event.preventDefault();">
        <div class="form-grid">
          <div class="form-group">
            <label for="first_name">First Name</label>
            <input type="text" id="first_name" name="first_name" value="Sarthak" autocomplete="given-name" />
          </div>
          <div class="form-group">
            <label for="last_name">Last Name</label>
            <input type="text" id="last_name" name="last_name" value="Patil" autocomplete="family-name" />
          </div>
          <div class="form-group full-width">
            <label for="full_name">Full Name as per ID</label>
            <input type="text" id="full_name" name="full_name" value="Sarthak Patil" autocomplete="name" placeholder="Enter your full name" />
          </div>
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" value="sarthak.patil@privacy-test.org" autocomplete="email" />
          </div>
          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" value="+1 (555) 019-2834" autocomplete="tel" />
          </div>
          <div class="form-group full-width">
            <label for="card">Credit Card Number</label>
            <input type="text" id="card" name="card_number" value="4532 0150 1234 5671" autocomplete="cc-number" />
          </div>
        </div>
        <button type="submit" class="btn-submit">Save Settings</button>
      </form>
    </div>
  </div>
</body>
</html>
